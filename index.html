<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NJ EMI Store – IRR Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1a2e;--paper:#eef2f7;--card:#fff;--line:#d9e1ec;--mute:#5d6c84;--blue:#2d5be3;--teal:#00967f;--amber:#b45f06;--hero:#0e1a2e;--herotext:#fff;--chip:#e3eaf5}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef8;--paper:#0a1220;--card:#121d31;--line:#243350;--mute:#95a5c0;--blue:#7ea0ff;--teal:#2fd1b3;--amber:#f0a84a;--hero:#1b2b4a;--chip:#1a2942}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 2px 2px;letter-spacing:-.01em}
.sub{margin:0 2px 14px;color:var(--mute);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs .wide{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 10px}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.field i{font-style:normal;color:var(--mute);font-size:14px}
input{width:100%;border:0;background:transparent;color:var(--ink);font:600 17px system-ui,sans-serif;padding:11px 4px;outline:none;min-width:0}
#err{color:var(--amber);font-size:13px;margin:10px 0 0;min-height:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:600 14px system-ui,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);color:#fff}
.hero{background:var(--hero);color:var(--herotext);border-radius:16px;padding:18px 18px 8px;margin-bottom:14px}
.hero .lbl{font-size:13px;opacity:.75}
.hero .big{font-size:44px;font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.hero .big small{font-size:15px;font-weight:500;opacity:.7;letter-spacing:0}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:rgba(0,200,160,.2);color:#6ff0d3}
.pill.warn{background:rgba(255,170,60,.2);color:#ffc57a}
.facts{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.facts div{padding:10px 0;border-top:1px solid rgba(255,255,255,.14)}
.facts div:nth-child(odd){padding-right:10px}
.facts span{display:block;font-size:12px;opacity:.7}
.facts b{font-size:16px;font-weight:650}
h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:650}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;font:inherit;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row[aria-pressed=true]{background:var(--chip);border-radius:10px}
.row .t{font-weight:650}
.row .e{font-weight:700;font-size:16px}
.row .m{font-size:12px;color:var(--mute)}
.row .s{text-align:right;font-size:12px;color:var(--teal);font-weight:650;max-width:120px}
.row .s.warn{color:var(--amber)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--paper);border-radius:10px;padding:9px 11px}
.stats span{display:block;font-size:12px;color:var(--mute)}
.stats b{font-size:15px}
.chart{width:100%;table-layout:fixed;border-collapse:collapse}
.chart th{font-size:12px;color:var(--mute);font-weight:650;text-align:right;padding:6px 6px 8px;border-bottom:2px solid var(--line)}
.chart td{padding:9px 5px;font-size:13.5px;border-bottom:1px solid var(--line);text-align:right;font-weight:600}
.chart th:first-child,.chart td:first-child{text-align:left}
.chart tr.on td{background:var(--chip)}
.chart tr:last-child td{border-bottom:0}
.chart tr.cr{cursor:pointer}
.chart tr.xp td{padding:0 0 14px;text-align:left;font-weight:400;font-size:13px;white-space:normal}
.chart .sch{margin-top:2px}
.chart .bk td{font-weight:500}
.chart .bk td:nth-child(2){font-weight:700}
.chart .bk tfoot td{font-weight:750}
.bar{display:block;height:5px;border-radius:3px;background:var(--blue);margin-top:5px;margin-left:auto;opacity:.75}
details{font-size:13px;color:var(--mute)}
summary{cursor:pointer;font-weight:650;color:var(--ink);font-size:14px}
details ol{padding-left:18px;margin:10px 0 0}
details li{margin-bottom:6px}

.sch{margin-top:12px;text-align:left;white-space:normal}
.sch .sh{font-weight:700;margin:0 0 2px;color:var(--ink)}
.sch .ss{color:var(--mute);font-size:12px;margin-bottom:6px}
.sch .sx{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);color:var(--ink)}
.sch .sx b{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--acc,var(--gold));display:grid;place-items:center;font-size:11px}
.sch .sx.bp b{border-color:var(--warn)}
.sch .sx u{text-decoration:none;font-weight:650}
.sch .sx em{display:block;font-style:normal;color:var(--mute);font-size:11.5px}
.sch .sx strong{font-weight:750}
.sch details{padding:0;font-size:inherit;color:inherit}
.sch summary{cursor:pointer;color:var(--acc,var(--gold));font-weight:650;padding:6px 0;font-size:12.5px}
.sch .pl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.sch .pl div{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink)}
.sch .pl div:last-child{border:0}
.sch .pl i{font-style:normal;color:var(--mute);min-width:78px;text-align:right}

.bkw{max-width:100%;overflow-x:auto;overflow-y:auto;max-height:440px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:transparent}
.bk{width:100%;min-width:0;border-collapse:collapse;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.bk th{position:sticky;top:0;background:var(--card,var(--panel));color:var(--mute);font-size:10.5px;font-weight:650;text-align:right;padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.bk td{text-align:right;padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.bk th:first-child,.bk td:first-child{text-align:left}
.bk small{font-size:9.5px;font-weight:700;margin-left:2px}
.bk td:nth-child(2){font-weight:700}
.bk tr.bp td{color:var(--warn)}
.bk tfoot td{position:sticky;bottom:0;background:var(--card,var(--panel));font-weight:750;border-top:2px solid var(--line);border-bottom:0}

/* Break-up table: centred, immune to outer .chart td rules */
.chart tr.xp .bk{table-layout:fixed;width:100%;min-width:320px}
.chart tr.xp .bk th,.chart tr.xp .bk td{text-align:center;padding:8px 2px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink)}
.chart tr.xp .bk th{font-size:10.5px;font-weight:650;color:var(--mute);padding:7px 2px}
.chart tr.xp .bk td:nth-child(2){font-weight:700}
.chart tr.xp .bk tr.bp td{color:var(--warn,var(--amber))}
.chart tr.xp .bk tfoot td{font-weight:750}
.chart tr.xp .bk td:first-child,.chart tr.xp .bk th:first-child{text-align:center;width:13%}

/* ===== Design refresh: ledger green + marigold ===== */
:root{--ink:#14211c;--paper:#eef1ec;--card:#fbfcfa;--line:#d6ddd6;--mute:#5b6d64;--blue:#0e3b31;--teal:#0e6b57;--amber:#b4561b;--warn:#b4561b;--acc:#0e6b57;--gold:#f2b01e;--hero:#0e3b31;--chip:#e2e9e2;--disp:"Sora","Manrope",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#e6eee9;--paper:#0b1512;--card:#121e1a;--line:#223630;--mute:#92a69d;--blue:#f2b01e;--teal:#4fd1b0;--amber:#ff9d6b;--warn:#ff9d6b;--acc:#4fd1b0;--hero:#15483b;--chip:#1a2c26}}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding-top:20px}
h1{font:700 24px/1.15 var(--disp);letter-spacing:-.02em;margin:4px 2px 4px}
.sub{font-size:13.5px}
.panel{border-radius:10px;background:var(--card)}
h2{font:600 14px var(--disp);color:var(--ink);letter-spacing:0}
label{font-weight:500}
.field{border-radius:8px;background:var(--paper)}
.field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 24%,transparent)}
input{font:600 17px "Manrope",system-ui,sans-serif}
.chips{gap:6px}
.chip{border-radius:8px;font:600 14px "Manrope",system-ui,sans-serif;background:var(--chip);transition:background .15s,color .15s}
.chip[aria-pressed=true]{background:var(--hero);color:var(--gold)}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{background:var(--gold);color:#0b1512}}
.hero{border-radius:20px;padding:22px 20px 10px;background:var(--hero)}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{font:700 58px/1 var(--disp);letter-spacing:-.035em;color:var(--gold);margin:8px 0 12px}
.hero .big small{font:500 15px "Manrope",sans-serif;color:#fff;opacity:.7;letter-spacing:0}
.pill{background:rgba(242,176,30,.18);color:#f7cc62;border-radius:6px}
.pill.warn{background:rgba(255,255,255,.14);color:#ffc4a6}
.facts b{font:600 17px var(--disp)}
.row{border-radius:0;grid-template-columns:58px 1fr auto}
.row .t{font:600 15px var(--disp)}
.row .e{font:700 18px var(--disp);letter-spacing:-.01em}
.row[aria-pressed=true]{background:var(--chip);border-radius:8px;box-shadow:inset 3px 0 0 var(--gold)}
.row .s{color:var(--teal)}
.row .s.warn{color:var(--amber)}
.chart th{color:var(--mute)}
.chart tr.on td{background:var(--chip)}
.chart tr.cr td:first-child{font-family:var(--disp);font-weight:600}
.bar{background:var(--gold);opacity:1;height:4px}
.stats div{border-radius:8px;background:var(--paper)}
.stats b{font-family:var(--disp)}
.chart tr.xp .bk th{background:var(--card)}
.chart tr.xp .bk tr.bp td{color:var(--amber)}
.sch .sx.bp b{border-color:var(--amber)}
summary{font-family:var(--disp)}
@media(prefers-reduced-motion:reduce){.chip{transition:none}}

/* ===== Icons, tenure colour grading, charts ===== */
:root{--pc:#0e6b57}
@media(prefers-color-scheme:dark){:root{--pc:#4fd1b0}}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-right:7px}
.hero .lbl,.facts span{display:flex;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none}
.chip{display:inline-flex;align-items:center}
.chip .dot{margin-right:6px}
.row{grid-template-columns:66px 1fr auto}
.row .t,.chart tr.cr td:first-child{display:flex;align-items:center}
.chart tr.cr td:first-child{display:table-cell}
.dnw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn{width:150px;height:150px;flex:none}
.dn text{fill:var(--ink);text-anchor:middle}
.dn .d1{font:700 22px var(--disp)}
.dn .d2{font-size:11px;fill:var(--mute)}
.lg{flex:1;min-width:160px;display:grid;gap:12px}
.lg>div{display:flex;align-items:center;gap:10px}
.lg .sw{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.lg .sw .ic{margin:0;width:17px;height:17px}
.sw.p{background:var(--pc);color:var(--card)}
.sw.i{background:var(--gold);color:#14211c}
.sw.t{background:var(--chip);color:var(--ink)}
.lg b{display:block;font:700 17px var(--disp);line-height:1.15}
.lg .l{font-size:12px;color:var(--mute)}
.keys{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:0 0 6px;align-items:center}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:14px;height:8px;border-radius:2px;display:inline-block}
.k1{background:linear-gradient(90deg,hsl(165 62% 46%),hsl(15 62% 46%))}
.k2{background:repeating-linear-gradient(135deg,var(--gold) 0 3px,color-mix(in srgb,var(--gold) 50%,transparent) 3px 6px)}
.bgl{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;font:inherit;padding:7px 6px;border-radius:8px;cursor:pointer}
.bgl[aria-pressed=true]{background:var(--chip)}
.bgl .bt{font:600 13px var(--disp);display:flex;align-items:center}
.bb>div{display:flex;align-items:center;gap:6px;height:15px}
.bb i{display:block;height:10px;border-radius:0 5px 5px 0;min-width:2px}
.bb em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.b2 i{background:repeating-linear-gradient(135deg,var(--gold) 0 4px,color-mix(in srgb,var(--gold) 50%,transparent) 4px 8px)}
.grad{height:6px;border-radius:3px;margin:12px 0 4px;background:linear-gradient(90deg,hsl(165 62% 46%),hsl(90 62% 46%),hsl(15 62% 46%))}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}

/* ===== Chart tabs ===== */
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px;margin:0 0 12px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 13px "Manrope",system-ui,sans-serif;padding:8px 6px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tabs .ic{margin-right:6px}
.cg{width:100%;height:auto;display:block}
.gl0{stroke:var(--line);stroke-width:1}
.yl{font-size:9.5px;fill:var(--mute);text-anchor:end}
.xl{font-size:10px;fill:var(--mute);text-anchor:middle}
.xl.on{fill:var(--ink);font-weight:700}
.xt{font-size:10px;fill:var(--mute);text-anchor:middle}
.vl{font:700 11px var(--disp);fill:var(--ink);text-anchor:middle}
.hit{cursor:pointer}
.dl{font:600 9.5px var(--disp);fill:var(--mute);text-anchor:start;pointer-events:none}
.dl.on{fill:var(--ink);font-weight:700}
.ro{margin-top:8px;font-size:13px;color:var(--mute)}
.ro b{color:var(--ink)}
.ro .cmp{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);color:var(--ink)}
.k3{background:var(--pc)}
.k4{background:var(--gold)}

/* ===== Header band ===== */
.top{background:linear-gradient(135deg,#0a2b24 0%,#0e5a49 100%);border-bottom:4px solid var(--gold);padding:20px 14px 22px}
.topin{max-width:720px;margin:auto;display:flex;align-items:center;gap:13px;padding:0 2px}
.top h1{color:#fff;margin:0 0 3px;font-size:22px}
.top .sub{color:rgba(255,255,255,.78);margin:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--gold);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#0a2b24;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
main{padding-top:16px}

/* ===== Blue theme ===== */
:root{--ink:#0f1b33;--paper:#edf2fa;--card:#fbfcff;--line:#d5deee;--mute:#5a6b88;--blue:#1f4fb8;--teal:#1f5fd0;--acc:#1f5fd0;--pc:#2457c5;--hero:#12306b;--chip:#e0e8f6}
@media(prefers-color-scheme:dark){:root{--ink:#e6edfa;--paper:#0a1226;--card:#111c36;--line:#22345a;--mute:#93a4c6;--blue:#7fb0ff;--teal:#7fb0ff;--acc:#7fb0ff;--pc:#7fb0ff;--hero:#17336b;--chip:#1a2a4d}}
.top{background:linear-gradient(135deg,#0b1f4a 0%,#1d4fb4 100%)}
.logo svg{stroke:#0b1f4a}
.k1{background:linear-gradient(90deg,hsl(205 70% 48%),hsl(15 70% 48%))}
.grad{background:linear-gradient(90deg,hsl(205 70% 48%),hsl(110 70% 48%),hsl(15 70% 48%))}
.field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 24%,transparent)}

/* ===== Blue to light cyan gradients ===== */
.top{background:radial-gradient(circle at 100% 100%,rgba(140,238,250,.85),transparent 48%),linear-gradient(120deg,#0f3a9a 0%,#1b78d0 62%,#2bb5e0 100%)}
.top h1,.top .sub{text-shadow:0 1px 6px rgba(8,30,90,.35)}
.hero{background:radial-gradient(circle at 100% 0,rgba(70,214,236,.5),transparent 55%),linear-gradient(135deg,#12378a 0%,#14509f 100%)}
body{background:linear-gradient(180deg,#d9f3fb 0,var(--paper) 340px) no-repeat var(--paper)}
@media(prefers-color-scheme:dark){
 body{background:linear-gradient(180deg,#0c2438 0,var(--paper) 340px) no-repeat var(--paper)}
 .hero{background:radial-gradient(circle at 100% 0,rgba(70,214,236,.32),transparent 55%),linear-gradient(135deg,#14336f 0%,#17407f 100%)}
}

/* ===== All tenures: centred, aligned columns ===== */
.row{grid-template-columns:minmax(82px,1fr) 1.2fr .9fr .9fr;gap:4px;padding:10px 2px;text-align:center;align-items:center}
.row .t{white-space:nowrap;gap:6px}
.wn{color:var(--amber);font-weight:800;margin-left:3px}
.row>span{text-align:center;justify-content:center}
.row .t{font-size:13.5px}
.row .e{font-size:15.5px}
.row .m{font-size:13px;color:var(--ink);font-weight:500}
.row .s{max-width:none;text-align:center;font-size:11.5px}
.rowh{cursor:default;border-bottom:2px solid var(--line)!important;padding:4px 2px 7px}
.rowh span{font-size:11.5px;font-weight:650;color:var(--mute)}

/* ===== NEON DASHBOARD: dark bento layout ===== */
:root,:root:not([x]){--ink:#e9f0ff;--paper:#060a12;--card:#0f1626;--line:#1f2d4a;--mute:#8b9bbd;--blue:#22d3ee;--teal:#22d3ee;--acc:#22d3ee;--pc:#22d3ee;--gold:#fbbf24;--amber:#fb923c;--warn:#fb923c;--hero:#1a1260;--chip:#16213a;--disp:"Sora","Manrope",system-ui,sans-serif;color-scheme:dark}
body,input,button{font-family:"Manrope",system-ui,sans-serif}
body{background:radial-gradient(800px 380px at 88% -120px,rgba(139,92,246,.32),transparent 70%),radial-gradient(700px 380px at 0 -80px,rgba(34,211,238,.2),transparent 70%),#060a12 no-repeat}
.top{background:transparent;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(34,211,238,.25);padding:16px 14px}
.topin{max-width:1120px}
.top h1{font:700 20px var(--disp);text-shadow:none}
.top .sub{text-shadow:none;color:var(--mute)}
.logo{background:linear-gradient(135deg,#22d3ee,#8b5cf6);border-radius:14px}
.logo svg{stroke:#05101c}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
h2{font:600 14px var(--disp);color:var(--ink)}
.field{background:#0a1220;border-radius:12px}
.field:focus-within{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.chips{gap:8px}
.chip{background:var(--chip);color:var(--ink);border-radius:999px;font-weight:600}
.chip[aria-pressed=true]{background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#05101c}
.hero{background:radial-gradient(500px 220px at 100% 0,rgba(139,92,246,.55),transparent 70%),radial-gradient(420px 220px at 0 100%,rgba(34,211,238,.3),transparent 70%),#0d1530;border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px}
.hero .big{font:700 clamp(44px,9vw,68px)/1 var(--disp);letter-spacing:-.04em;background:linear-gradient(90deg,#67e8f9,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 14px}
.hero .big small{font:500 15px "Manrope",sans-serif;color:var(--mute);-webkit-text-fill-color:var(--mute);letter-spacing:0}
.pill{background:rgba(34,211,238,.16);color:#67e8f9;border-radius:8px}
.pill.warn{background:rgba(251,146,60,.18);color:#fdba74}
.facts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.facts div,.facts div:nth-child(odd){border:0;background:rgba(255,255,255,.06);border-radius:14px;padding:11px 13px}
.facts b{font:700 17px var(--disp)}
.row[aria-pressed=true]{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(139,92,246,.16));box-shadow:inset 3px 0 0 #22d3ee}
.row .s{color:#22d3ee}.row .s.warn{color:var(--amber)}
.rowh span{color:var(--mute)}
.tabs{background:#0a1220}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#05101c;box-shadow:none}
.chart tr.on td{background:var(--chip)}
.k1{background:linear-gradient(90deg,hsl(190 85% 62%),hsl(340 85% 62%))}
.grad{background:linear-gradient(90deg,hsl(190 85% 62%),hsl(265 85% 62%),hsl(340 85% 62%))}
.stats d
